{% extends "base.html" %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/formato_formulario.css') }}">
{% endblock %}

{% block content %}
<section>

  <!-- =================== FORMULARIO =================== -->
  <div class="card">

      <!-- TÍTULO -->
      <div class="title-block">
          <div class="icon-box">
              <span class="nav-icon">📝</span>
          </div>
          <div>
              <div class="form-title">Entradas</div>
              <div class="form-sub">Registro básico de personas</div>
          </div>
      </div>

      <form id="form-entrada">

          <div class="section">
              <h4>Datos de la Persona</h4>

              <!-- Nombre + Apellido -->
              <div class="row two-cols">
                  <div class="field">
                      <label>Nombre *</label>
                      <input required class="input" type="text" name="nombre" placeholder="Ej: Carlos">
                  </div>

                  <div class="field">
                      <label>Apellido *</label>
                      <input required class="input" type="text" name="apellido" placeholder="Ej: Torres">
                  </div>
              </div>

              <!-- DNI -->
              <div class="row one-col">
                  <div class="field">
                      <label>DNI *</label>
                      <input required class="input" type="text" name="dni" placeholder="Ej: 78945612">
                  </div>
              </div>

              <div id="mensaje" class="notification is-hidden"></div>
          </div>

          <!-- BOTONES -->
          <div class="form-actions">
              <button type="button" class="button is-secondary" id="btnNuevo">Nuevo</button>
              <button type="button" class="button is-primary" id="btnGuardar">Guardar</button>
              <button type="button" class="button is-success" id="btnEditar">Editar</button>
          </div>

      </form>
  </div>

  <!-- =================== LISTADO =================== -->
  <div class="card">

      <!-- Buscador -->
      <form id="form-buscar" class="field has-addons mt-4">
          <div class="control">
              <input class="input" type="text" name="b_nombre" placeholder="Buscar por nombre">
          </div>
          <div class="control">
              <input class="input" type="text" name="b_dni" placeholder="Buscar por DNI">
          </div>
          <div class="control">
              <button type="button" class="button is-link" id="btnBuscar">Buscar</button>
          </div>
      </form>

      <!-- Tabla -->
      <table class="table is-striped is-hoverable mt-4" id="tabla-entradas">
          <thead>
              <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Apellido</th>
                  <th>DNI</th>
              </tr>
          </thead>
          <tbody>
              {% for e in entradas %}
              <tr class="clickable-row" data-id="{{ e.id }}">
                  <td>{{ e.id }}</td>
                  <td>{{ e.nombre }}</td>
                  <td>{{ e.apellido }}</td>
                  <td>{{ e.dni }}</td>
              </tr>
              {% endfor %}
          </tbody>
      </table>

  </div>

</section>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/entradas.js') }}"></script>
{% endblock %}
